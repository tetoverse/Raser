[package]
name = "app"
version = "1.2.6"
description = "Raser Desktop Music Player"
authors = ["Raser Contributors"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["rlib"]

[[bin]]
name = "raser"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
discord-rich-presence = "0.2"
rfd = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "blocking"] }
rodio = "0.23.0"
rustfft = "6.4.1"
rtrb = "0.3"
urlencoding = "2.1"
iced = { version = "0.14", features = ["canvas", "image", "svg", "tokio", "advanced"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
image = "0.25"
tray-icon = "0.25"
global-hotkey = "0.8"
raw-window-handle = "0.6"
